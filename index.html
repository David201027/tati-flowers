<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tati-Flowers-ISR</title>
    <link rel="stylesheet" href="./css/reset.css">

</head>
<body>
    <header>
        <div class="container header-div">
            <h1 id="logo">TATI flowers</h1>
            <button class="menu-toggle" aria-label="Открыть меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        
            <nav class="nav-menu">
                <ul>
                    <li><a href="./">Home</a></li>
                    <li><a href="./">All categories</a></li>
                    <li><a href="./">Special products</a></li>
                    <li><a href="./">Gifts and offers</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <body>
        <section class="hero">
            <div class="container hero-div">
                <ul class="hero-flowers-list">
                    <li class="hero-card">
                        <img class="hero-cards-img" src="./images/flowers-1.png" alt="flower-buket">
                        <div class="hero-card-info">
                            <h3>Buket-1</h3>
                            <p class="hero-price">Price: 200₪</p>
                        </div>
                    </li>
                    <li class="hero-card">
                        <img class="hero-cards-img" src="./images/flowers-2.png" alt="flower-buket">

                            <h3>Buket-2</h3>
                            <p class="hero-price">Price: 150₪</p>
                        </div>
                    </li>
                    <li class="hero-card">
                        <img class="hero-cards-img" src="./images/flowers-3.png" alt="flower-buket">
                        <div class="hero-card-info">
                            <h3>Buket-3</h3>
                            <p class="hero-price">Price: 250₪</p>
                        </div>
                    </li>
                    <li class="hero-card">
                        <img class="hero-cards-img" src="./images/flowers-4.png" alt="flower-buket">
                        <div class="hero-card-info">
                            <h3>Buket-4</h3>
                            <p class="hero-price">Price: 300₪</p>
                        </div>
                    </li>
                </ul>
            </div>
        </section>
    </body>
    <script src="./js/burger.js"></script>
